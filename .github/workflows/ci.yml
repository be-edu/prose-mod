name: build-prose-mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code from git repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Show go version
        run: go version

      - name: Print working directory
        run: pwd

      - name: Build
        run: go build ./prose